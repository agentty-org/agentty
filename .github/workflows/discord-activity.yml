name: discord-activity

# Split ALL repo activity into per-type Discord channels.
#
# GitHub's native webhook -> Discord "/github" adapter is one-channel-per-URL,
# so to route by event TYPE we forward each event's raw payload to the matching
# channel webhook here. Discord still renders every event natively (commit
# lists, issue/PR cards, release notes, stars) — we just choose the destination.
#
# Channels (each a repo secret holding the Discord webhook URL, WITHOUT the
# trailing /github — the workflow appends it):
#   DISCORD_WH_COMMITS   -> #github    (push)
#   DISCORD_WH_ACTIVITY  -> #github    (issues, PRs, reviews, discussions)
#   DISCORD_WH_RELEASES  -> #github    (release, create/delete tags & branches)
#   DISCORD_WH_STARS     -> #github    (star, fork)
#
# #releases itself only gets one clean card per release, posted by the
# community bot (it polls GitHub), so a release reads as "it dropped".
#
# Any secret left unset -> that event is skipped silently.

on:
  push:
  issues:
    types: [opened, edited, closed, reopened, labeled, assigned]
  issue_comment:
    types: [created]
  # pull_request_target (not pull_request) so PRs from forks are forwarded too:
  # it runs in the base repo's context with secrets, and this job never checks
  # out or executes PR code — it only relays the event payload to Discord.
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  discussion:
    types: [created, answered, closed, reopened]
  discussion_comment:
    types: [created]
  release:
    types: [published, released]
  create:
  delete:
  fork:
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    # Hard allowlist: only ever run for the product repo itself. If this file
    # is forked or copied elsewhere, github.repository won't match and the job
    # is skipped entirely — the Discord webhooks can never be posted to from
    # any other repository.
    if: github.repository == 'agentty-org/agentty'
    steps:
      - name: Route event to the right Discord channel
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event) }}
          REPO: ${{ github.repository }}
          WH_COMMITS: ${{ secrets.DISCORD_WH_COMMITS }}
          WH_ACTIVITY: ${{ secrets.DISCORD_WH_ACTIVITY }}
          WH_RELEASES: ${{ secrets.DISCORD_WH_RELEASES }}
          WH_STARS: ${{ secrets.DISCORD_WH_STARS }}
        run: |
          set -euo pipefail

          # ---- Defense in depth: only forward events that genuinely belong to
          # the product repo. Both the workflow context AND the event payload
          # must name agentty-org/agentty, so a spoofed/mismatched payload is dropped
          # before any Discord webhook is contacted.
          ALLOWED_REPO="agentty-org/agentty"
          if [ "$REPO" != "$ALLOWED_REPO" ]; then
            echo "Refusing: workflow repo '$REPO' != '$ALLOWED_REPO'."; exit 0
          fi
          PAYLOAD_REPO=$(printf '%s' "$PAYLOAD" | jq -r '.repository.full_name // empty')
          if [ -n "$PAYLOAD_REPO" ] && [ "$PAYLOAD_REPO" != "$ALLOWED_REPO" ]; then
            echo "Refusing: payload repo '$PAYLOAD_REPO' != '$ALLOWED_REPO'."; exit 0
          fi

          # Map the event type to a destination webhook.
          # Fork PRs arrive via pull_request_target; Discord's adapter knows the
          # payload as a plain pull_request event.
          case "$EVENT" in
            push)
              WH="$WH_COMMITS" ;;
            issues|issue_comment|pull_request|pull_request_target|pull_request_review|pull_request_review_comment|discussion|discussion_comment)
              WH="$WH_ACTIVITY" ;;
            release|create|delete)
              WH="$WH_RELEASES" ;;
            watch|star|fork)
              WH="$WH_STARS" ;;
            *)
              echo "Unhandled event '$EVENT' — skipping."; exit 0 ;;
          esac

          if [ -z "${WH:-}" ]; then
            echo "No webhook configured for '$EVENT' — skipping."; exit 0
          fi

          # Skip empty pushes (e.g. branch deletes arrive as push with no commits
          # AND a delete event; let the delete event handle those).
          if [ "$EVENT" = "push" ]; then
            commits=$(printf '%s' "$PAYLOAD" | jq '.commits | length')
            if [ "$commits" = "0" ]; then
              echo "Push with no commits — skipping (handled by create/delete)."; exit 0
            fi
          fi

          # Forward the raw payload to Discord's native GitHub adapter. Passing
          # the original X-GitHub-Event header lets Discord render it natively.
          # Note: the Actions trigger for starring is `watch`, but Discord's
          # adapter expects the webhook event name `star` — translate it.
          GH_EVENT="$EVENT"
          [ "$EVENT" = "watch" ] && GH_EVENT="star"
          [ "$EVENT" = "pull_request_target" ] && GH_EVENT="pull_request"
          code=$(printf '%s' "$PAYLOAD" | curl -s -o /tmp/resp -w '%{http_code}' \
            -X POST "$WH/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: $GH_EVENT" \
            --data-binary @-)
          echo "Discord ($EVENT) responded: $code"
          cat /tmp/resp 2>/dev/null || true
          # 204 = posted, 200 = accepted; anything else is a failure worth seeing.
          [ "$code" = "204" ] || [ "$code" = "200" ]
